[project]
name = "sms-spam-classifier"
version = "0.1.0"
description = "SMS spam detection with Multinomial Naive Bayes (scikit-learn, NLTK)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "nltk>=3.8",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "joblib>=1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "jupyterlab>=4.0",  # optional, only if you add notebooks
]

[tool.uv]
# `src/` is run as a plain package (`python -m src.train`), not built or
# installed, so tell uv to only manage the environment.
package = false

[tool.ruff]
